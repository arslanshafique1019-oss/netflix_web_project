<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="/signIn.css">
</head>
<body>
    <div class="header">
        <img src="/pngwing.com.png" class="logo">

        <div class="allsignin">
            <div class="heading">
                <h2>Sign In</h2>
            </div>
    
            <div class="content1">
                <input type="text" placeholder="Email or mobile number">
            </div>

            <div class="content2">
                <input type="password" placeholder="Password">
            </div>

            <div class="click">
                <button>Sign In</button>
                <p>OR</p>
            </div>

            <div class="code">
                <button>Use a Sign-In Code</button><br>
                <a href="#">Forgot password?</a>
            </div>

            <div class="sel">
                <input type="checkbox">
                <p>Remember me</p>
            </div>

            <div class="tag">
                <p>New to Netflix?</p>
                <a href="#">Sign up now.</a>
            </div>
            <br>
            <div class="end">
                <p>This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
                <a href="#">learn more.</a>
            </div>
        </div>
    </div>


    <div class="footer">
        <a href="#">Questions? Contact us.</a>
    </div>

    <div class="footer1">
        <ul class="col0">
            <a href="#">FAQ</a>
            <a href="#">Cookie Preferences</a>
        </ul>

        <ul class="col1">
            <a href="#">Help Center</a>
            <a href="#">Corporate Information</a>
        </ul>

        <ul class="col2">
            <a href="#">Term of use</a>
        </ul>

        <ul class="col3">
            <a href="#">Privacy</a>
        </ul>
    </div>

    <div class="endfooter">
        <select class="lang">
         <option value="English">English</option>
        </select>
     </div>
</body>
</html>
